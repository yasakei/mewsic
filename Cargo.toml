[package]
name = "mewsic"
version = "1.3.1"
edition = "2021"
build = "src/build.rs"
description = "Mewsic — mirror the song you're playing into your Discord status, line by line."
authors = ["Yasakei"]
license = "MIT"

[[bin]]
name = "mewsic"
path = "src/main.rs"

[workspace]
members = [".", "libs/jptomew", "libs/bntomew"]

[dependencies]
jptomew = { path = "libs/jptomew" }
bntomew = { path = "libs/bntomew" }
any_ascii = "0.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
crossterm = "0.28"
ratatui = "0.29"
base64 = "0.22"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Yasakei <yasakei@users.noreply.github.com>"
copyright = "2026 Yasakei"
section = "utils"
priority = "optional"

[package.metadata.generate-rpm]
description = "Mewsic — mirror the song you're playing into your Discord status, line by line."
summary = "Mirror the song you're playing into your Discord status"
license = "MIT"
vendor = "Yasakei"
assets = [
    { source = "target/release/mewsic", dest = "/usr/bin/mewsic", mode = "755" },
]

[package.metadata.wix]
upgrade-guid = "252820C1-09D2-40D9-97B0-555B35BE4D0C"
path-guid = "50097253-D378-46ED-A68D-D764F442CD25"
license = false
eula = false
install-scope = "perUser"
# per-user avoids admin + HKLM PATH (less Wacapew) — installs to %LOCALAPPDATA%
