name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: mewsic
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: mewsic
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin: mewsic
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: mewsic
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: mewsic.exe

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install aarch64 Linux cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package raw binary
        shell: bash
        run: |
          mkdir -p dist
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/mewsic-${{ matrix.target }}$exe"

      - name: Build Linux .deb and .rpm (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked
          cargo deb --target x86_64-unknown-linux-gnu
          cargo build --release
          cargo generate-rpm
          cp target/debian/*.deb dist/ 2>/dev/null || cp target/x86_64-unknown-linux-gnu/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/

      - name: Build Windows installer (WiX MSI per-user)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "Building WiX MSI (per-user, no Store)..."
          cargo install cargo-wix --locked || cargo install cargo-wix
          # init wix files if not present (idempotent); -p needed since this repo is a cargo workspace
          cargo wix init --force -p mewsic 2>&1 | head -20 || true
          # patch to perUser if needed (cargo-wix 0.3+ respects install-scope perUser from Cargo.toml, but ensure)
          if [ -f wix/main.wxs ]; then
            sed -i 's/InstallScope="perMachine"/InstallScope="perUser"/g' wix/main.wxs || true
            sed -i 's/InstallPrivileges="elevated"/InstallPrivileges="limited"/g' wix/main.wxs || true
            grep -q "perUser" wix/main.wxs && echo "patched to perUser" || echo "wix perUser already or not found"
          fi
          cargo wix -p mewsic --nocapture 2>&1 | tail -50
          ls -R target/wix/ 2>/dev/null | head -100 || true
          cp target/wix/*.msi dist/ 2>/dev/null || cp target/wix/**/*.msi dist/ 2>/dev/null || true
          ls -lh dist/*.msi 2>/dev/null || echo "no msi found, listing dist:"; ls -lh dist/ || true

      - name: Build macOS installer (DMG)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dmg/Mewsic
          cp "target/${{ matrix.target }}/release/mewsic" dmg/Mewsic/mewsic
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Mewsic" -srcfolder dmg -ov -format UDZO "dist/mewsic-${{ matrix.target }}.dmg"

      - name: Windows Defender scan dist/ (Windows only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Running Windows Defender scan on dist/ ..."
          $defender = "C:\Program Files\Windows Defender\MpCmdRun.exe"
          $mpLog = "C:\Users\RUNNER~1\AppData\Local\Temp\MpCmdRun.log"
          if (Test-Path $defender) {
            & $defender -Scan -ScanType 3 -File dist -DisableRemediation
            $code = $LASTEXITCODE
            Write-Host "Defender exit code: $code"
            if (Test-Path $mpLog) {
              Write-Host "--- MpCmdRun.log tail ---"
              Get-Content $mpLog -Tail 100 2>$null | Write-Host
              Write-Host "--- end log ---"
            }
            if ($code -eq 0) {
              Write-Host "Defender clean - no threats."
            } elseif ($code -eq 2) {
              Write-Host "::warning::Defender exit 2 - scan error (0x80508023 common on GH runners), not failing job. See MpCmdRun.log above."
            } else {
              Write-Host "::warning::Defender code $code"
            }
          } else {
            Write-Host "::warning::MpCmdRun not found"
          }
          exit 0

      - name: Sign Windows artifacts (Authenticode + Cosign + checksums)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          echo "=== Windows Code Signing ==="
          ls -lh dist/ || true
          echo "--- Generating SHA256 checksums ---"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt) || true
          # 1. Authenticode via signtool if WINDOWS_CERT secrets are configured
          if [ -n "${{ secrets.WINDOWS_CERT_BASE64 }}" ] && [ -n "${{ secrets.WINDOWS_CERT_PASSWORD }}" ]; then
            echo "Authenticode certificate found, signing with signtool..."
            echo "${{ secrets.WINDOWS_CERT_BASE64 }}" | base64 --decode > /tmp/cert.pfx
            SIGNTOOL=$(find "/c/Program Files (x86)/Windows Kits" -name "signtool.exe" 2>/dev/null | head -1)
            if [ -z "$SIGNTOOL" ]; then SIGNTOOL=$(find "/c/Program Files/Windows Kits" -name "signtool.exe" 2>/dev/null | head -1); fi
            if [ -z "$SIGNTOOL" ]; then SIGNTOOL="signtool"; fi
            echo "Using signtool: $SIGNTOOL"
            for f in dist/*.exe dist/*.msi; do
              [ -f "$f" ] || continue
              echo "Signing $f with signtool..."
              "$SIGNTOOL" sign //fd SHA256 //f /tmp/cert.pfx //p "${{ secrets.WINDOWS_CERT_PASSWORD }}" //tr http://timestamp.digicert.com //td SHA256 "$f" 2>&1 || echo "::warning::signtool failed for $f"
              "$SIGNTOOL" verify //pa "$f" 2>&1 | head -20 || echo "::warning::verify failed for $f"
            done
            rm -f /tmp/cert.pfx
            # Re-generate checksums after signing (signing modifies binary)
            (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt) || true
          else
            echo "::notice::No WINDOWS_CERT secrets - skipping Authenticode. For production:"
            echo "  1. Azure Trusted Signing (free for OSS): https://azure.github.io/trusted-signing-action/"
            echo "  2. Or set WINDOWS_CERT_BASE64 (pfx base64) + WINDOWS_CERT_PASSWORD secrets"
          fi
          # 2. Cosign keyless signing (free, GitHub OIDC) - works without secrets
          echo "--- Cosign keyless signing ---"
          COSIGN=""
          if command -v cosign >/dev/null 2>&1; then
            COSIGN=cosign
          else
            echo "Installing cosign..."
            curl -sL -o /tmp/cosign.exe https://github.com/sigstore/cosign/releases/latest/download/cosign-windows-amd64.exe 2>&1 || echo "cosign download failed"
            if [ -f /tmp/cosign.exe ]; then
              chmod +x /tmp/cosign.exe
              COSIGN=/tmp/cosign.exe
            fi
          fi
          if [ -n "$COSIGN" ] && ( command -v "$COSIGN" >/dev/null 2>&1 || [ -f "$COSIGN" ] ); then
            echo "Using cosign: $COSIGN"
            "$COSIGN" version 2>&1 || true
            for f in dist/*; do
              [ -f "$f" ] || continue
              case "$f" in *.sig|*.pem|*.txt) continue;; esac
              echo "cosign sign-blob $f"
              "$COSIGN" sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f" 2>&1 | tee -a cosign.log || echo "::warning::cosign failed for $f (may need id-token: write)"
              ls -lh "$f.sig" "$f.pem" 2>/dev/null || true
            done
            cat cosign.log 2>/dev/null | tail -50 || true
          else
            echo "::warning::cosign not available, skipping"
          fi
          echo "--- Final dist contents ---"
          ls -R dist || true
          cat dist/SHA256SUMS.txt 2>/dev/null || true

      - name: Attest Windows build provenance (Sigstore)
        if: runner.os == 'Windows'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: mewsic-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  arch:
    name: arch package
    runs-on: ubuntu-latest
    needs: build
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Node.js and git (required by Actions inside container)
        run: pacman -Syu --noconfirm nodejs git

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: mewsic-x86_64-unknown-linux-gnu
          path: dist
          merge-multiple: true

      - name: Create non-root builder and build package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          VERSION="$(grep '^version' Cargo.toml | head -1 | sed -E 's/.*\"([^\"]+)\".*/\1/')"
          mkdir -p pkg
          cp dist/mewsic-x86_64-unknown-linux-gnu pkg/mewsic
          cat > pkg/PKGBUILD <<EOF
          pkgname=mewsic
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="Mewsic — mirror the song you're playing into your Discord status, line by line."
          arch=('x86_64')
          url="https://github.com/${{ github.repository }}"
          license=('MIT')
          options=('!debug')
          source=("mewsic")
          md5sums=('SKIP')
          package() {
            install -Dm755 "mewsic" "\${pkgdir}/usr/bin/mewsic"
          }
          EOF
          chown -R builder:builder pkg
          su builder -c "cd '$GITHUB_WORKSPACE/pkg' && makepkg -f --noconfirm"
          mkdir -p pkgout
          cp pkg/*.pkg.tar.zst pkgout/

      - uses: actions/upload-artifact@v4
        with:
          name: mewsic-arch
          path: pkgout/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: release
    needs: [build, arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Sign Windows artifacts in release (Cosign keyless + checksums)
        shell: bash
        run: |
          echo "=== Release signing: Windows artifacts ==="
          find artifacts -type f -name "*.exe" -o -name "*.msi" | head -20
          # Sign each Windows PE file with cosign (keyless, free via GitHub OIDC)
          for f in artifacts/*/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.exe|*.msi)
                echo "cosign sign-blob $f"
                cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f" 2>&1 | tail -20 || echo "::warning::cosign failed for $f"
                ls -lh "$f.sig" "$f.pem" 2>/dev/null || true
                ;;
              *) echo "Skipping non-Windows $f" ;;
            esac
          done
          # Generate checksums before signing (exclude scan-report logs and signatures)
          ( cd artifacts && find . -type f ! -name "checksums.txt*" ! -name "*.sig" ! -name "*.pem" ! -path "./clamav-scan-report-*/*" | sort | xargs sha256sum | sed -E 's#  (./)?[^/]+/#  #' > checksums.txt )
          cat artifacts/checksums.txt
          # Cosign the checksums file itself
          cosign sign-blob --yes --output-signature artifacts/checksums.txt.sig --output-certificate artifacts/checksums.txt.pem artifacts/checksums.txt 2>&1 | tail -20 || echo "::warning::cosign checksums failed"
          ls -lh artifacts/checksums.txt.* 2>/dev/null || true
          # Optional Authenticode via osslsigncode if WINDOWS_CERT secrets present (cross-platform)
          if [ -n "${{ secrets.WINDOWS_CERT_BASE64 }}" ]; then
            echo "WINDOWS_CERT found, attempting osslsigncode for Windows binaries..."
            sudo apt-get update && sudo apt-get install -y osslsigncode 2>&1 | tail -5 || true
            echo "${{ secrets.WINDOWS_CERT_BASE64 }}" | base64 --decode > /tmp/cert.pfx
            for f in artifacts/*/*.exe; do
              [ -f "$f" ] || continue
              echo "osslsigncode sign $f"
              osslsigncode sign -pkcs12 /tmp/cert.pfx -pass "${{ secrets.WINDOWS_CERT_PASSWORD }}" -n "Mewsic" -i "https://github.com/${{ github.repository }}" -t http://timestamp.digicert.com -in "$f" -out "$f.signed" 2>&1 | tail -20 || echo "::warning::osslsigncode failed for $f"
              if [ -f "$f.signed" ]; then mv "$f.signed" "$f"; echo "Signed $f"; fi
            done
            rm -f /tmp/cert.pfx
            # Re-generate checksums after signing
            ( cd artifacts && find . -type f ! -name "checksums.txt*" ! -name "*.sig" ! -name "*.pem" ! -path "./clamav-scan-report-*/*" | sort | xargs sha256sum | sed -E 's#  (./)?[^/]+/#  #' > checksums.txt )
            cat artifacts/checksums.txt
          else
            echo "::notice::No WINDOWS_CERT secrets for osslsigncode - skipping Authenticode cross-signing. For production Authenticode, configure WINDOWS_CERT_BASE64 + WINDOWS_CERT_PASSWORD or Azure Trusted Signing."
          fi
          echo "--- Final artifacts for release ---"
          find artifacts -type f | sort | xargs ls -lh 2>/dev/null || true

      - name: Attest build provenance for release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/**/*

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Use existing checksums.txt from signing step if present, else generate
          if [ ! -f artifacts/checksums.txt ]; then
            ( cd artifacts && find . -type f ! -name "checksums.txt*" ! -name "*.sig" ! -name "*.pem" ! -path "./clamav-scan-report-*/*" | sort | xargs sha256sum | sed -E 's#  (./)?[^/]+/#  #' > checksums.txt )
          fi
          cat artifacts/checksums.txt
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            || true
          # Upload only real release assets (mewsic-* artifacts + checksums);
          # skip clamav-scan-report-* logs. Retry to survive transient 404s
          # from the uploads endpoint right after release creation.
          UPLOAD_OK=0
          for i in 1 2 3 4 5; do
            if gh release upload "${GITHUB_REF_NAME}" artifacts/mewsic-*/* artifacts/checksums.txt* --clobber; then
              echo "Release upload succeeded (attempt $i)."
              UPLOAD_OK=1
              break
            fi
            echo "Release upload failed (attempt $i/5), retrying in 15s..."
            sleep 15
          done
          if [ "$UPLOAD_OK" != "1" ]; then
            echo "::error::gh release upload failed after 5 attempts"
            exit 1
          fi
