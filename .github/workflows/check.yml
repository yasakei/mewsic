name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build all targets
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Clippy (warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      - name: Install ClamAV
        shell: bash
        run: |
          echo "Installing ClamAV on $RUNNER_OS..."
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y clamav
            sudo systemctl stop clamav-freshclam || true
            sudo rm -f /var/log/clamav/freshclam.log
            for i in 1 2 3; do
              echo "Updating virus database (attempt $i/3)..."
              if sudo freshclam --verbose; then
                echo "Database updated successfully."
                break
              fi
              echo "freshclam failed, retrying in 10s..."
              sleep 10
              if [ "$i" = "3" ]; then
                echo "::warning::Failed to update ClamAV DB after 3 attempts."
              fi
            done
            clamscan --version
            ls -lh /var/lib/clamav/ || true
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew update
            brew install clamav
            for conf in /opt/homebrew/etc/clamav/freshclam.conf.sample /usr/local/etc/clamav/freshclam.conf.sample; do
              if [ -f "$conf" ]; then
                dest="${conf%.sample}"
                mkdir -p "$(dirname "$dest")"
                cp "$conf" "$dest" 2>/dev/null || sudo cp "$conf" "$dest" || true
                sed -i.bak 's/^Example/#Example/' "$dest" 2>/dev/null || sed -i '' 's/^Example/#Example/' "$dest" || true
              fi
            done
            for i in 1 2 3; do
              echo "Updating virus database (attempt $i/3)..."
              if freshclam --verbose; then
                echo "Database updated."
                break
              fi
              sleep 10
            done
            clamscan --version
            ls -lh /opt/homebrew/var/lib/clamav/ 2>/dev/null || ls -lh /usr/local/var/lib/clamav/ 2>/dev/null || ls -lh /var/lib/clamav/ || true
          elif [ "$RUNNER_OS" = "Windows" ]; then
            choco install clamav -y --no-progress || echo "choco clamav failed"
            mkdir -p clamav-db
            cat > freshclam-win.conf <<'EOF'
            DatabaseMirror database.clamav.net
            DatabaseMirror clamav.easynet.fr
            DatabaseDirectory clamav-db
            MaxAttempts 3
            ScriptedUpdates yes
            CompressLocalDatabase yes
            Bytecode yes
            EOF
            cat freshclam-win.conf
            for i in 1 2 3; do
              echo "Updating virus database (attempt $i/3)..."
              if freshclam --config-file=freshclam-win.conf --verbose 2>&1 | tee freshclam.log; then
                echo "freshclam success"
                break
              fi
              REAL_FRESH=$(find /c/ProgramData/chocolatey -name "freshclam.exe" -type f 2>/dev/null | head -1)
              if [ -n "$REAL_FRESH" ] && [ -f "$REAL_FRESH" ]; then
                echo "Trying real freshclam: $REAL_FRESH"
                if "$REAL_FRESH" --config-file="$(pwd)/freshclam-win.conf" --verbose 2>&1 | tee -a freshclam.log; then
                  break
                fi
              fi
              sleep 10
            done
            cat freshclam.log || true
            ls -R clamav-db 2>/dev/null | head -50 || ls -lh clamav-db/ || true
            clamscan --database=clamav-db --version 2>&1 || clamscan --version 2>&1 || true
            REAL_SCAN=$(find /c/ProgramData/chocolatey -name "clamscan.exe" -type f 2>/dev/null | head -1)
            if [ -n "$REAL_SCAN" ]; then
              "$REAL_SCAN" --database=clamav-db --version 2>&1 || true
            fi
          fi

      - name: Virus scan (ClamAV)
        shell: bash
        run: |
          echo "Scanning build artifacts on $RUNNER_OS..."
          set +e
          CLAMSCAN="clamscan"
          CLAM_DB_ARGS=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -d clamav-db ] && ( ls clamav-db/*.cvd >/dev/null 2>&1 || ls clamav-db/*.cld >/dev/null 2>&1 ); then
              CLAM_DB_ARGS="--database=clamav-db"
            fi
            if ! command -v clamscan >/dev/null 2>&1; then
              REAL_SCAN=$(find /c/ProgramData/chocolatey -name "clamscan.exe" -type f 2>/dev/null | head -1)
              if [ -n "$REAL_SCAN" ] && [ -f "$REAL_SCAN" ]; then
                CLAMSCAN="$REAL_SCAN"
              fi
            fi
            # need DB arg for clamscan on Windows
            if [ -n "$CLAM_DB_ARGS" ]; then
              echo "Using DB: clamav-db ($(ls clamav-db | tr '\n' ' '))"
            else
              echo "::warning::clamav-db not found, using default DB path"
            fi
          fi
          echo "Using scanner: $CLAMSCAN $CLAM_DB_ARGS"
          "$CLAMSCAN" $CLAM_DB_ARGS --version 2>&1 || true
          # single pipeline so PIPESTATUS[0] is reliable
          "$CLAMSCAN" $CLAM_DB_ARGS -r \
            --infected \
            --suppress-ok-results \
            --scan-archive=yes \
            --alert-broken=yes \
            --heuristic-alerts=yes \
            --cross-fs=no \
            --max-filesize=4000M \
            --max-scansize=4000M \
            target 2>&1 | tee clamav-scan.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "ClamAV exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" = "0" ]; then
            echo "✓ No viruses detected in build artifacts."
          elif [ "$EXIT_CODE" = "1" ]; then
            echo "::error::Virus detected in build artifacts! See log above."
            exit 1
          elif [ "$EXIT_CODE" = "2" ]; then
            echo "::error::ClamAV scan error (exit 2). See log."
            cat clamav-scan.log
            exit 1
          else
            echo "::error::ClamAV failed with exit $EXIT_CODE"
            cat clamav-scan.log || true
            exit 1
          fi

      - name: Windows Defender scan (Windows only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Running Windows Defender scan on target/ ..."
          $defender = "C:\Program Files\Windows Defender\MpCmdRun.exe"
          if (Test-Path $defender) {
            & $defender -Scan -ScanType 3 -File target -DisableRemediation
            $code = $LASTEXITCODE
            Write-Host "Defender exit code: $code"
            if ($code -eq 2) {
              Write-Host "::error::Windows Defender detected threats!"
              exit 1
            } elseif ($code -ne 0 -and $code -ne 2) {
              Write-Host "::warning::Defender scan returned $code (may be clean)"
            } else {
              Write-Host "✓ Defender: no threats."
            }
          } else {
            Write-Host "::warning::MpCmdRun not found, skipping Defender scan"
          }

      - name: Upload ClamAV scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clamav-scan-report-${{ matrix.os }}
          path: |
            clamav-scan.log
            freshclam.log
          if-no-files-found: warn
