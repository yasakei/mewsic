[package]
name = "jptomew"
version = "0.1.0"
edition = "2021"
description = "jptomew — transliterate hiragana, katakana and kanji (Japanese text) into rōmaji"
authors = ["Yasakei"]
license = "MIT"

[dependencies]
byteorder = "1.4.3"
phf = { version = "0.11.1", features = ["macros"] }
phf_shared = "0.11.1"
unicode-normalization = "0.1.22"
