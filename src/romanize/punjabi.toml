# Gurmukhi (Punjabi) abugida, romanized the way Punjabi lyrics are usually
# written in Latin script: no vowel-length distinction (ਆ/ਾ -> "a",
# ਈ/ੀ -> "i"), ਵ -> "v", tippi/bindi as n or silent.
#
# Word-final inherent vowels are kept only after ਰ/ੜ following a plain CV
# syllable (ਘਰ -> "ghar", ਸ਼ਹਿਰ -> "shehar") and dropped elsewhere
# (ਦਿਲ -> "dil", ਪੰਜਾਬ -> "panjab").
#
# The adhak (ੱ) doubles the next consonant's first letter:
# ਕੱਕਾ -> "kakka", ਪੱਖੀ -> "pakkhi", ਸੱਚਾ -> "saccha".

[[scripts]]
name = "punjabi"
kind = "abugida"
dialect = "punjabi"
range_start = 0x0A00
range_end = 0x0A7F
punctuation = ""
halant = "੍"
anusvara = "ੰ"
candrabindu = "ਂ"
visarga = "ਃ"
nukta = "਼"
gemination = "ੱ"
inherent = "a"
labials = "ਪਫਬਭਮ"
digits = "੦੧੨੩੪੫੬੭੮੯"

