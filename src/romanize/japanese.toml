# Japanese word readings for kanji compounds.
# Kana are romanized by the jptomew library (libs/jptomew).
# This file provides whole-word kanji readings that jptomew's dictionary
# may not cover correctly. Add words as you meet them in songs.
#
# Conventions: Hepburn-style, matching jptomew's output (long おう -> "ou",
# し -> "shi", ち -> "chi").

[[scripts]]
name = "japanese"
kind = "words"

